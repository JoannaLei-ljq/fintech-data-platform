version: 2

models:
  - name: stg_users
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: stg_merchants
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]

  - name: stg_transactions
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: merchant_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_merchants')
                field: merchant_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, succeeded, failed]

  - name: stg_refunds
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_transactions')
                field: transaction_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, succeeded, failed]
